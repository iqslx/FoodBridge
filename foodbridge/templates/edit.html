{% extends 'base.html' %}{% block title %}Edit donation{% endblock %}{% block content %}<div class="compact"><p><a href="{{ url_for('flow.detail',donation_id=d['id']) }}">← Back to donation</a></p><section class="form-card"><p class="eyebrow">Keep your details up to date</p><h2>Edit donation</h2><p class="muted">Charities with pending or accepted requests will be notified.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="field"><label for="food_type">Food type / description</label><input id="food_type" name="food_type" value="{{ request.form.get('food_type',d['food_type']) }}" required></div><div class="field"><label for="quantity">Quantity</label><input type="number" step="any" min="0.000001" id="quantity" name="quantity" value="{{ request.form.get('quantity',d['quantity']) }}" required></div><div class="field"><label for="expiry_date">Expiry date</label><input id="expiry_date" name="expiry_date" dir="ltr" placeholder="YYYY-MM-DD" pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}" value="{{ request.form.get('expiry_date',date) }}" required><p class="help">Available until the end of this day (Saudi Arabia).</p></div><div class="field"><label for="pickup_address">Pickup address</label><input id="pickup_address" name="pickup_address" value="{{ request.form.get('pickup_address',d['pickup_address']) }}" required></div><button class="btn">Save changes</button></form></section></div>{% endblock %}
